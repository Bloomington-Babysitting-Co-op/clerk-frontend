<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/_env.js"></script>
  <script src="/js/fast-auth.js"></script>
  <title>Requests – BBC Clerk</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex flex-col min-h-screen bg-gray-50">
  <nav id="navbar" class="bg-indigo-600 text-white shadow">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="/" class="bg-white text-indigo-600 text-2xl font-bold hover:bg-blue-300 px-4 py-1 rounded" title="Go to dashboard">BBC Clerk</a>
      </div>
      <div class="flex gap-2 items-center" data-nav-links>
        <a href="/requests.html" class="bg-white text-blue-600 hover:bg-blue-300 px-4 py-2 rounded">Requests</a>
        <a href="/ledger.html" class="bg-white text-blue-600 hover:bg-blue-300 px-4 py-2 rounded">Ledger</a>
        <a href="/families.html" class="bg-white text-blue-600 hover:bg-blue-300 px-4 py-2 rounded">Families</a>
        <span data-admin-slot></span>
      </div>
    </div>
  </nav>

  <main class="flex-1 p-6 max-w-6xl mx-auto w-full">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold">Requests</h1>
      <a href="/request-new.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">New Request</a>
    </div>

    <div class="bg-white border p-4 rounded-lg shadow mb-6">
      <div class="grid grid-cols-6 max-[400px]:grid-cols-2 md:grid-cols-[repeat(5,minmax(0,1fr))_auto_auto] gap-3 items-end">
        <div class="col-span-3 max-[400px]:col-span-1 md:col-span-1">
          <label class="block text-sm font-medium mb-1">Start Date</label>
          <input id="requests-start-date" type="date" class="border p-2 w-full rounded">
        </div>
        <div class="col-span-3 max-[400px]:col-span-1 md:col-span-1">
          <label class="block text-sm font-medium mb-1">End Date</label>
          <input id="requests-end-date" type="date" class="border p-2 w-full rounded">
        </div>
        <div class="col-span-2 max-[400px]:col-span-2 md:col-span-1">
          <label class="block text-sm font-medium mb-1">Family</label>
          <select id="requests-family-select" class="border p-2 w-full rounded">
            <option value="">All Families</option>
          </select>
        </div>
        <div class="col-span-2 max-[400px]:col-span-1 md:col-span-1">
          <label class="block text-sm font-medium mb-1">Status</label>
          <div id="requests-status-filter">
            <details class="relative">
              <summary class="border p-2 w-full rounded bg-white cursor-pointer select-none flex justify-between items-center">
                <span data-ms-summary>Status (3)</span><span class="text-gray-400 text-xs">▼</span>
              </summary>
              <div class="absolute z-10 mt-1 w-full min-w-40 bg-white border rounded shadow p-2 flex flex-col gap-1">
                <button type="button" data-ms-toggle-all class="text-xs text-blue-600 hover:underline text-left mb-1">Select all</button>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="open" checked> Open</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="offered" checked> Offered</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="assigned" checked> Assigned</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="completed"> Completed</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="cancelled"> Cancelled</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="expired"> Expired</label>
              </div>
            </details>
          </div>
        </div>
        <div class="col-span-2 max-[400px]:col-span-1 md:col-span-1">
          <label class="block text-sm font-medium mb-1">Type</label>
          <div id="requests-type-filter">
            <details class="relative">
              <summary class="border p-2 w-full rounded bg-white cursor-pointer select-none flex justify-between items-center">
                <span data-ms-summary>Type: All</span><span class="text-gray-400 text-xs">▼</span>
              </summary>
              <div class="absolute z-10 mt-1 w-full min-w-40 bg-white border rounded shadow p-2 flex flex-col gap-1">
                <button type="button" data-ms-toggle-all class="text-xs text-blue-600 hover:underline text-left mb-1">Clear all</button>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="babysit" checked> Babysit</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="drive" checked> Drive</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="favor" checked> Favor</label>
              </div>
            </details>
          </div>
        </div>
        <button id="requests-apply-filter-btn" class="col-span-3 max-[400px]:col-span-1 md:col-span-1 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Apply Filters</button>
        <button id="requests-export-csv-btn" class="col-span-3 max-[400px]:col-span-1 md:col-span-1 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Export CSV</button>
      </div>
      <p id="requests-error" class="text-red-600 mt-2"></p>
    </div>

    <div id="requests-list" class="grid gap-4"></div>
  </main>

  <script type="module">
    import { mountRequestsPage } from "/js/requests.js";
    await mountRequestsPage();
  </script>

  <script src="https://unpkg.com/alpinejs" defer></script>
</body>
</html>
